# Builds the debug APK on every push and publishes it as a workflow artifact,
# so testable builds can be downloaded straight from a PR's Checks tab
# (Actions run → Artifacts → app-debug-apk). Debug builds use the auto-generated
# debug keystore, so no signing secrets are needed.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The NDK/CMake toolchain for uinput_jni is resolved automatically by AGP
      # from the runner's pre-installed Android SDK.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
